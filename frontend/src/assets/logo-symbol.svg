<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-labelledby="job-hunter-symbol-title">
  <title id="job-hunter-symbol-title">Job Hunter 심볼</title>
  <style>
    .jh-ring { fill: none; stroke: #7f77dd; }
    .jh-dot { fill: #7f77dd; }
    @media (prefers-color-scheme: dark) {
      .jh-ring { stroke: #afa9ec; }
      .jh-dot { fill: #afa9ec; }
    }
  </style>
  <g stroke-width="6" stroke-linecap="round">
    <circle class="jh-ring" cx="40" cy="40" r="19"/>
    <line class="jh-ring" x1="40" y1="4" x2="40" y2="16"/>
    <line class="jh-ring" x1="40" y1="76" x2="40" y2="64"/>
    <line class="jh-ring" x1="4" y1="40" x2="16" y2="40"/>
    <line class="jh-ring" x1="76" y1="40" x2="64" y2="40"/>
  </g>
  <circle class="jh-dot" cx="40" cy="40" r="8"/>
</svg>
