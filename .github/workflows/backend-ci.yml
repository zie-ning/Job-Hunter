name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # app/db/session.py가 모듈 임포트 시점에 즉시 엔진을 생성하므로, 실제 DB에
      # 접속하지 않는 테스트/임포트 검증 스텝도 파싱 가능한 URL 형식이 필요하다.
      # 테스트는 SQLite로 get_db를 오버라이드해서 돌기 때문에 이 값으로 실제 접속을 시도하지 않는다.
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: 의존성 설치
        run: pip install -r requirements-dev.txt

      - name: 린트 (ruff check)
        run: ruff check .

      - name: 포맷 검사 (ruff format --check)
        run: ruff format --check .

      - name: 테스트 (pytest)
        run: pytest

      - name: 앱 임포트 검증 (구문 오류 및 누락된 의존성 조기 탐지)
        run: python -c "from app.main import app"
