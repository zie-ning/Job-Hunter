# Render Blueprint — 백엔드(FastAPI) 배포 설정
# https://render.com/docs/blueprint-spec
#
# Render 대시보드에서 "New +" → "Blueprint"로 이 저장소를 연결하면
# 아래 정의를 읽어 서비스를 자동 생성한다. sync: false로 표시된 값은
# 저장소에 커밋하지 않고 Render 대시보드에서 직접 입력해야 하는 시크릿이다.

services:
  - type: web
    name: job-hunter-backend
    runtime: python
    plan: free
    region: singapore # Supabase DB가 Seoul 리전이라 지연시간이 가장 짧은 리전 선택
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # Supabase connection string (postgresql+asyncpg://...)
      - key: SECRET_KEY
        generateValue: true # Render가 안전한 랜덤 값을 자동 생성
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: KAKAO_CLIENT_ID
        sync: false # 카카오 디벨로퍼스 콘솔의 REST API 키
      - key: KAKAO_CLIENT_SECRET
        sync: false # 콘솔에서 "Client Secret 사용"을 켠 경우에만 필요, 안 켰으면 빈 값으로 둬도 됨
      - key: KAKAO_REDIRECT_URI
        sync: false # 배포된 프론트 도메인 확정 후 입력 (예: https://job-hunter.vercel.app/auth/kakao/callback)
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false # 프론트엔드 Vercel 배포 URL 확정 후 입력 (예: ["https://job-hunter.vercel.app"])
